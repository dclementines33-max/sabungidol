<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marble Match · preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Bungee&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="scoreboard" class="scoreboard" aria-label="Scoreboard"></div>

  <header class="brand">
    <p class="kicker">Sabung Idol · Marble Match preview</p>
    <h1 id="arena-name">…</h1>
    <p class="tagline" id="arena-tag"></p>
    <p class="lap"><span id="clock">0.00</span></p>
  </header>

  <ol id="tower" class="tower" aria-label="Standing"></ol>
  <div id="series" class="laps" aria-label="Series"></div>
  <div id="tags" aria-hidden="true"></div>
  <div id="lights" class="lights" hidden><span></span><span></span><span></span></div>
  <section id="intro" class="intro" hidden aria-live="polite"></section>
  <p id="banner" class="banner" hidden></p>

  <aside id="panel" class="panel">
    <button id="fold" class="fold" aria-expanded="true">Setup</button>
    <div class="body">
      <label class="count">Marbles <output id="count-out">2</output><input id="count" type="range" min="2" max="20" value="2" /></label>
      <ol id="field" class="field" aria-label="Field"></ol>
      <button id="shuffle" class="ghost">Shuffle the field</button>
      <p class="mode" id="mode">Best of</p>
      <div class="row" role="group" aria-label="Best of">
        <button data-bo="3">Bo3</button><button data-bo="4">Bo4</button><button data-bo="5" class="on">Bo5</button><button data-bo="7">Bo7</button>
      </div>
      <label>Rating advantage <output id="adv-out">1.0×</output><input id="advantage" type="range" min="0" max="2" step="0.1" value="1" /></label>
      <p id="edge" class="edge"></p>
      <div class="row" role="group" aria-label="Camera">
        <button data-cam="tv" class="on">TV</button><button data-cam="chase">Chase</button><button data-cam="free">Free</button>
      </div>
      <div class="row" role="group" aria-label="Quality">
        <button data-quality="high" class="on">High</button><button data-quality="low">Low</button>
      </div>
      <div class="actions"><button id="start" class="primary">Start match</button></div>
      <label>Try one arena <select id="try"></select></label>
      <p class="hint">Match seed <output id="seed"></output> · every game gets a different arena.</p>
    </div>
  </aside>

  <div class="controls" role="group" aria-label="Playback">
    <button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
    <button id="skip">Skip game</button><button id="skip-all">Skip match</button>
  </div>

  <section id="result" class="result" hidden aria-live="polite"></section>
  <p id="loading" class="loading">Loading the arenas…</p>
  <div id="lost" class="loading" hidden><p>The graphics card reset the 3D view.<br><button id="reload" class="primary">Reload the view</button></p></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
